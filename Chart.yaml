apiVersion: v2
name: vp-manage-proxy-cluster-ca
description: >-
  OpenShift chart for cluster-wide Proxy trusted CA bundles. Each cluster exports CAs via ESO PushSecret
  to Vault; ExternalSecret and trust-manager Bundle merge labeled Secrets into openshift-config. Hub CronJob
  writes hub-export material and patches Proxy/cluster. No ACM or ManifestWork required.
type: application
version: 0.2.0
keywords:
  - openshift
  - proxy
  - tls
  - validated-patterns
  - external-secrets
  - trust-manager
