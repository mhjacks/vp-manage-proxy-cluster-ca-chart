apiVersion: v2
name: vp-manage-proxy-cluster-ca
description: >-
  Hub-side chart for OpenShift. With ACM (default), distributes a merged CA bundle to ManagedClusters
  via ManifestWork (spoke push + hub ingress, then gather job), including Proxy/cluster trustedCA on spokes unless turned off.
  Set acm.enabled false for a standalone cluster: merge hub trusted-ca only and manage local Proxy/ConfigMap without ACM APIs.
  ACM Policy + PlacementBinding (when acm.enabled) add Governance visibility with default inform remediation; they do not gate rollout.
  Override policy.* or excludeManagedClusters as needed.
type: application
version: 0.1.0
keywords:
  - openshift
  - acm
  - proxy
  - tls
  - validated-patterns
  - policy
  - manifestwork
