# Placeholders: @@SPOKE_NAMESPACE@@ @@PUSH_IMAGE@@ @@CRON_SCHEDULE@@ @@CLUSTER_VALUE@@ @@HUB_NAMESPACE@@ @@INCLUDE_INGRESS@@ @@INCLUDE_SYSTEM_TRUST@@
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vp-proxy-ca-push-bundle
  namespace: @@SPOKE_NAMESPACE@@
spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  schedule: "@@CRON_SCHEDULE@@"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: vp-proxy-ca-pusher
          containers:
            - name: push
              image: @@PUSH_IMAGE@@
              imagePullPolicy: IfNotPresent
              env:
                - name: CLUSTER_NAME
                  value: "@@CLUSTER_VALUE@@"
                - name: HUB_NAMESPACE
                  value: "@@HUB_NAMESPACE@@"
                - name: INCLUDE_INGRESS_CA
                  value: "@@INCLUDE_INGRESS@@"
                - name: INCLUDE_SYSTEM_TRUST_STORE
                  value: "@@INCLUDE_SYSTEM_TRUST@@"
              command:
                - /bin/bash
                - /scripts/run.sh
              volumeMounts:
                - name: hubapi
                  mountPath: /hub-api
                  readOnly: true
                - name: runsh
                  mountPath: /scripts/run.sh
                  subPath: run.sh
                  readOnly: true
          volumes:
            - name: hubapi
              secret:
                secretName: vp-proxy-ca-hub-api
            - name: runsh
              configMap:
                name: vp-proxy-ca-push-run
                defaultMode: 0555
