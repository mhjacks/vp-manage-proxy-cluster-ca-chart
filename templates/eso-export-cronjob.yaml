{{- if .Values.eso.export.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export
  namespace: {{ include "vpProxyCa.esoExportNamespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: eso-export
  annotations:
{{ include "vpProxyCa.esoExportSyncWaveAnnotations" . | nindent 4 }}
spec:
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  schedule: {{ .Values.eso.export.schedule | quote }}
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: OnFailure
{{- include "vpProxyCa.podHostUsers" . | nindent 10 }}
          serviceAccountName: {{ include "vpProxyCa.esoExportServiceAccountName" . }}
          containers:
{{ include "vpProxyCa.esoExportContainer" . | trim | indent 12 }}
          volumes:
{{ include "vpProxyCa.esoExportVolumes" . | trim | indent 12 }}
{{- end }}
