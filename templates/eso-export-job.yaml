{{- if and .Values.eso.export.enabled .Values.eso.export.syncJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export
  namespace: {{ include "vpProxyCa.esoExportNamespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: eso-export
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: {{ .Values.eso.export.syncJob.argoCDSyncWave | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
{{- include "vpProxyCa.podHostUsers" . | nindent 6 }}
      serviceAccountName: {{ include "vpProxyCa.esoExportServiceAccountName" . }}
      containers:
{{ include "vpProxyCa.esoExportContainer" . | trim | indent 8 }}
      volumes:
{{ include "vpProxyCa.esoExportVolumes" . | trim | indent 8 }}
{{- end }}
