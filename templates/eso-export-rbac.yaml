{{- if .Values.eso.export.enabled }}
{{- $exportNs := include "vpProxyCa.esoExportNamespace" . }}
{{- $exportSa := include "vpProxyCa.esoExportServiceAccountName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-writer
  namespace: {{ $exportNs }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-writer
  namespace: {{ $exportNs }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vpProxyCa.fullname" . }}-export-writer
subjects:
  - kind: ServiceAccount
    name: {{ $exportSa }}
    namespace: {{ $exportNs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-read-trust
  namespace: openshift-config-managed
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["trusted-ca-bundle", "kube-apiserver-server-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-read-trust
  namespace: openshift-config-managed
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vpProxyCa.fullname" . }}-export-read-trust
subjects:
  - kind: ServiceAccount
    name: {{ $exportSa }}
    namespace: {{ $exportNs }}
{{- if .Values.includeIngressCA }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-read-ingress
  namespace: openshift-ingress-operator
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["router-ca"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-read-ingress
  namespace: openshift-ingress-operator
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vpProxyCa.fullname" . }}-export-read-ingress
subjects:
  - kind: ServiceAccount
    name: {{ $exportSa }}
    namespace: {{ $exportNs }}
{{- end }}
{{- end }}
