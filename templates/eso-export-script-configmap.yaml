{{- if .Values.eso.export.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-export-run
  namespace: {{ include "vpProxyCa.esoExportNamespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: eso-export
data:
  export-cron.sh: |
{{ .Files.Get "files/eso-push/export-cron.sh" | indent 4 }}
{{- end }}
