{{- if .Values.eso.export.enabled }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Values.eso.pushSecret.name | quote }}
  namespace: {{ include "vpProxyCa.esoExportNamespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: eso-export
  annotations:
{{ include "vpProxyCa.esoPushSecretSyncWaveAnnotations" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.eso.pushSecret.refreshInterval | quote }}
  updatePolicy: {{ .Values.eso.pushSecret.updatePolicy | quote }}
  deletionPolicy: {{ .Values.eso.pushSecret.deletionPolicy | quote }}
  secretStoreRefs:
    - name: {{ include "vpProxyCa.esoSecretStoreName" . | quote }}
      kind: {{ include "vpProxyCa.esoSecretStoreKind" . | quote }}
  selector:
    secret:
      name: {{ .Values.eso.export.secretName | quote }}
  data:
    - match:
        secretKey: {{ .Values.eso.export.key | quote }}
        remoteRef:
          remoteKey: {{ include "vpProxyCa.esoVaultRemoteKey" . | quote }}
          property: {{ include "vpProxyCa.esoVaultProperty" . | quote }}
{{- end }}
