{{- if .Values.eso.externalSecret.enabled }}
{{- $labels := .Values.trustManager.labels | default dict }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.eso.externalSecret.name | quote }}
  namespace: {{ .Values.trustManager.trustNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: hub-externalsecret
  annotations:
{{ include "vpProxyCa.esoArgoSyncWaveAnnotations" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.eso.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "vpProxyCa.esoSecretStoreName" . | quote }}
    kind: {{ include "vpProxyCa.esoSecretStoreKind" . | quote }}
  target:
    name: {{ .Values.eso.externalSecret.targetSecretName | default .Values.eso.externalSecret.name | quote }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{ $labels.component | default "cluster-ca.vp.io/component" }}: {{ $labels.export | default "export" | quote }}
          app.kubernetes.io/name: {{ include "vpProxyCa.name" . | quote }}
          app.kubernetes.io/instance: {{ .Release.Name | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.eso.externalSecret.vaultKey | quote }}
{{- end }}
