{{- if and .Values.policy.enabled (not .Values.policy.placementRef.name) }}
{{- fail "policy.enabled requires policy.placementRef.name (workspace namespace: policy.placementRef.namespace or policy.hubNamespace)" }}
{{- end }}
{{- if .Values.policy.enabled }}
{{- $ra := .Values.policy.remediationAction | default "inform" | lower }}
{{- if not (or (eq $ra "inform") (eq $ra "enforce")) }}
{{- fail "policy.remediationAction must be inform or enforce" }}
{{- end }}
{{- $policyName := include "vpProxyCa.policyResourceName" . }}
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: {{ $policyName }}
  namespace: {{ include "vpProxyCa.policyWorkspaceNamespace" . }}
  annotations:
    policy.open-cluster-management.io/description: {{ .Values.policy.description | quote }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  disabled: false
  remediationAction: {{ $ra | quote }}
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: {{ $policyName }}
        spec:
          remediationAction: {{ $ra | quote }}
          severity: high
          customMessage: {{ .Values.policy.configurationCustomMessage | quote }}
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: config.openshift.io/v1
                kind: Proxy
                metadata:
                  name: cluster
                spec:
                  trustedCA:
                    name: {{ .Values.configMapName | quote }}
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: {{ $policyName }}-binding
  namespace: {{ include "vpProxyCa.policyWorkspaceNamespace" . }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
placementRef:
  name: {{ .Values.policy.placementRef.name }}
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: {{ $policyName }}
    kind: Policy
    apiGroup: policy.open-cluster-management.io
{{- end }}
