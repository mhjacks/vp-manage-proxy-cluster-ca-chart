{{- if and .Values.trustManager.enabled (eq (include "vpProxyCa.isHubCluster" .) "true") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-hub-export-writer
  namespace: {{ .Values.trustManager.trustNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-hub-export-writer
  namespace: {{ .Values.trustManager.trustNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vpProxyCa.fullname" . }}-hub-export-writer
subjects:
  - kind: ServiceAccount
    name: {{ include "vpProxyCa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
