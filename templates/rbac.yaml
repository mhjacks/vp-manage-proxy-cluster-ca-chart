{{- $trustManager := .Values.trustManager.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-hub
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
{{- if $trustManager }}
  - apiGroups: ["trust.cert-manager.io"]
    resources: ["bundles"]
    verbs: ["get", "list", "create", "update", "patch"]
{{- end }}
  - apiGroups: ["config.openshift.io"]
    resources: ["proxies"]
    verbs: ["get", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["infrastructures"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-hub
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vpProxyCa.fullname" . }}-hub
subjects:
  - kind: ServiceAccount
    name: {{ include "vpProxyCa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
