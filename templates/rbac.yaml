{{- $needSecrets := and .Values.acm.enabled (or (eq .Values.distributeToSpokes "kubeconfig") (eq .Values.managedClusterCaSource "spokeTrustedCaBundle")) }}
{{- $spokePush := and .Values.acm.enabled (eq .Values.managedClusterCaSource "spokePush") }}
{{- $manifestWork := and .Values.acm.enabled (eq .Values.distributeToSpokes "manifestwork") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-hub
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
{{- if $needSecrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
{{- end }}
{{- if $manifestWork }}
  - apiGroups: ["work.open-cluster-management.io"]
    resources: ["manifestworks"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
{{- end }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["config.openshift.io"]
    resources: ["proxies"]
    verbs: ["get", "patch"]
{{- if .Values.acm.enabled }}
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list"]
{{- end }}
{{- if $spokePush }}
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["{{ .Values.spokePush.hubNamespace }}"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-hub
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vpProxyCa.fullname" . }}-hub
subjects:
  - kind: ServiceAccount
    name: {{ include "vpProxyCa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
