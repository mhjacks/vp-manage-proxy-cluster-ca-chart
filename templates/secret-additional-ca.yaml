{{- if gt (len .Values.additionalCaBundles) 0 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-additional-ca
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  ca.pem: |
{{- range .Values.additionalCaBundles }}
{{ . }}
{{- end }}
{{- end }}
