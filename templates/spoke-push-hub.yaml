{{- if and (eq .Values.managedClusterCaSource "spokePush") .Values.acm.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.spokePush.hubNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: spoke-push-hub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vp-spoke-bundle-writer
  namespace: {{ .Values.spokePush.hubNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vp-spoke-bundle-writer
  namespace: {{ .Values.spokePush.hubNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vp-spoke-bundle-writer
  namespace: {{ .Values.spokePush.hubNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vp-spoke-bundle-writer
subjects:
  - kind: ServiceAccount
    name: vp-spoke-bundle-writer
    namespace: {{ .Values.spokePush.hubNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-tokenrequest
  namespace: {{ .Values.spokePush.hubNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["vp-spoke-bundle-writer"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-gather-tokenrequest
  namespace: {{ .Values.spokePush.hubNamespace }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vpProxyCa.fullname" . }}-tokenrequest
subjects:
  - kind: ServiceAccount
    name: {{ include "vpProxyCa.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
