{{- if and .Values.trustManager.enabled .Values.trustManager.labeledBundle.enabled }}
{{- $cfg := .Values.trustManager.labeledBundle }}
{{- $bundleName := include "vpProxyCa.labeledTrustBundleName" . }}
{{- $targetKey := $cfg.targetKey | default .Values.trustManager.targetKey }}
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ $bundleName }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $cfg.argoCDSyncWave | quote }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trust-bundle-labeled
spec:
  sources:
{{ include "vpProxyCa.trustBundleSources" . | nindent 4 }}
  target:
    configMap:
      key: {{ $targetKey | quote }}
    namespaceSelector:
{{ $cfg.namespaceSelector | toYaml | indent 6 }}
{{- end }}
