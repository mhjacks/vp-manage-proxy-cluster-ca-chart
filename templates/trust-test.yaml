{{- if and .Values.trustTest.enabled (gt (len .Values.trustTest.namespaces) 0) }}
{{- $root := . -}}
{{- $wave := .Values.trustTest.argoCDSyncWave | default 13 -}}
{{- $caKey := .Values.trustTest.caBundle.key | default .Values.trustManager.targetKey -}}
{{- $caMount := .Values.trustTest.caBundle.mountPath | default "/etc/pki/trust" -}}
{{- $caPath := printf "%s/%s" $caMount $caKey -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-trust-test
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trust-test
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
rules:
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    resourceNames: ["cluster"]
    verbs: ["get"]
  - apiGroups: ["config.openshift.io"]
    resources: ["infrastructures"]
    resourceNames: ["cluster"]
    verbs: ["get"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vpProxyCa.fullname" . }}-trust-test
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trust-test
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vpProxyCa.fullname" . }}-trust-test
subjects:
{{- range .Values.trustTest.namespaces }}
  - kind: ServiceAccount
    name: {{ include "vpProxyCa.fullname" $root }}-trust-test
    namespace: {{ include "vpProxyCa.trustTestNamespaceName" . }}
{{- end }}
{{- range .Values.trustTest.namespaces }}
{{- $nsName := include "vpProxyCa.trustTestNamespaceName" . }}
{{- $caConfigMap := include "vpProxyCa.trustTestCaBundleConfigMapName" (list $root .) }}
{{- $routeName := include "vpProxyCa.trustTestRouteName" (list $root .) }}
{{- $routeNamespace := include "vpProxyCa.trustTestRouteNamespace" (list $root .) }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vpProxyCa.fullname" $root }}-trust-test-script
  namespace: {{ $nsName }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: trust-test
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
data:
  verify-cluster-trust.sh: |
{{ $root.Files.Get "files/trust-test/verify-cluster-trust.sh" | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vpProxyCa.fullname" $root }}-trust-test
  namespace: {{ $nsName }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: trust-test
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vpProxyCa.fullname" $root }}-trust-test
  namespace: {{ $nsName }}
  labels:
    app.kubernetes.io/name: {{ include "vpProxyCa.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: trust-test
  annotations:
    argocd.argoproj.io/sync-wave: {{ $wave | quote }}
spec:
  schedule: {{ $root.Values.trustTest.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $root.Values.trustTest.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $root.Values.trustTest.failedJobsHistoryLimit | default 3 }}
  suspend: {{ $root.Values.trustTest.suspend | default false }}
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $root.Values.trustTest.activeDeadlineSeconds | default 900 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "vpProxyCa.name" $root }}
            app.kubernetes.io/instance: {{ $root.Release.Name }}
            app.kubernetes.io/component: trust-test
        spec:
          restartPolicy: Never
{{- include "vpProxyCa.podHostUsers" $root | nindent 10 }}
          serviceAccountName: {{ include "vpProxyCa.fullname" $root }}-trust-test
          containers:
            - name: trust-test
              image: {{ printf "%s:%s" (include "vpProxyCa.trustTestImageRepository" $root) (include "vpProxyCa.trustTestImageTag" $root) | quote }}
              imagePullPolicy: {{ include "vpProxyCa.trustTestImagePullPolicy" $root }}
              command:
                - /bin/bash
                - /scripts/verify-cluster-trust.sh
              env:
                - name: HOME
                  value: /tmp
                - name: CA_BUNDLE_PATH
                  value: {{ $caPath | quote }}
                - name: CA_WAIT_SECONDS
                  value: {{ $root.Values.trustTest.caWaitSeconds | default 300 | quote }}
                - name: ROUTE_NAME
                  value: {{ $routeName | quote }}
                - name: ROUTE_NAMESPACE
                  value: {{ $routeNamespace | quote }}
                - name: DISCOVER_MANAGED_CLUSTERS
                  value: {{ $root.Values.trustTest.discoverManagedClusters | default true | quote }}
                - name: INCLUDE_LOCAL_CLUSTER
                  value: {{ $root.Values.trustTest.includeLocalCluster | default true | quote }}
                - name: REQUIRE_REMOTE_REACHABLE
                  value: {{ $root.Values.trustTest.requireRemoteReachable | default false | quote }}
                - name: HUB_CLUSTER_DOMAIN
                  value: {{ ((($root.Values.global | default dict).hubClusterDomain) | default "") | quote }}
                - name: LOCAL_CLUSTER_DOMAIN
                  value: {{ ((($root.Values.global | default dict).localClusterDomain) | default "") | quote }}
                - name: TRUST_TEST_TARGETS_JSON
                  value: {{ $root.Values.trustTest.targets | default list | toJson | quote }}
              resources:
                {{- toYaml ($root.Values.trustTest.resources | default dict) | nindent 16 }}
              volumeMounts:
                - name: trust-script
                  mountPath: /scripts
                  readOnly: true
                - name: trust-bundle
                  mountPath: {{ $caMount | quote }}
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: trust-script
              configMap:
                name: {{ include "vpProxyCa.fullname" $root }}-trust-test-script
                defaultMode: 0555
            - name: trust-bundle
              configMap:
                name: {{ $caConfigMap }}
                optional: false
            - name: tmp
              emptyDir: {}
{{- end }}
{{- end }}
