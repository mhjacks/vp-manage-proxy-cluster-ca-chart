suite: cronjob
templates:
  - cronjob.yaml
release:
  name: testrel
tests:
  - it: renders hub CronJob when enabled on hub cluster
    set:
      hubCluster: true
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.namespace
          value: openshift-config
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          pattern: "^quay.io/validatedpatterns/imperative-container:"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WRITE_HUB_EXPORT
            value: "true"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INCLUDE_API_CA
            value: "true"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INCLUDE_INGRESS_CA
            value: "true"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INCLUDE_SYSTEM_TRUST_STORE
            value: "false"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TRUST_MANAGER_ENABLED
            value: "true"
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TRUST_NAMESPACE
            value: cert-manager
  - it: does not render hub CronJob on spoke cluster
    set:
      hubCluster: false
      cronJob:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: disables trust manager env when configured off
    set:
      hubCluster: true
      trustManager.enabled: false
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: TRUST_MANAGER_ENABLED
            value: "false"
  - it: allows includeApiCA to be disabled explicitly
    set:
      hubCluster: true
      includeApiCA: false
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: INCLUDE_API_CA
            value: "false"
  - it: mounts extra material when additionalCaBundles are provided
    set:
      hubCluster: true
      additionalCaBundles:
        - "TESTCERT"
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: ADDITIONAL_CA_FILE
            value: /extra/ca.pem
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts
          content:
            name: additional-ca
            mountPath: /extra
            readOnly: true
