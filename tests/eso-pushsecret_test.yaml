suite: eso pushsecret
templates:
  - eso-pushsecret.yaml
release:
  name: testrel
tests:
  - it: does not render when eso export is disabled
    set:
      eso:
        export:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders PushSecret with vault property override
    set:
      eso:
        export:
          enabled: true
          vaultProperty: ocp-primary
    asserts:
      - isKind:
          of: PushSecret
      - equal:
          path: metadata.namespace
          value: vp-proxy-ca-sync
      - equal:
          path: spec.data[0].match.remoteRef.property
          value: ocp-primary
      - equal:
          path: spec.data[0].match.remoteRef.remoteKey
          value: pushsecrets/cluster-ca
  - it: honors root secretStore name from clustergroup
    set:
      secretStore:
        name: my-cluster-store
      eso:
        export:
          enabled: true
    asserts:
      - equal:
          path: spec.secretStoreRefs[0].name
          value: my-cluster-store
  - it: adds argo sync-wave annotation when configured
    set:
      eso:
        pushSecret:
          argoCDSyncWave: 11
        export:
          enabled: true
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "11"
