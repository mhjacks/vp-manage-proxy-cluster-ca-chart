suite: hub externalsecret
templates:
  - hub-externalsecret.yaml
release:
  name: testrel
tests:
  - it: does not render when externalSecret is disabled
    set:
      eso:
        externalSecret:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders ExternalSecret in trust namespace using vault-backend
    set:
      eso:
        externalSecret:
          enabled: true
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.namespace
          value: cert-manager
      - equal:
          path: spec.secretStoreRef.name
          value: vault-backend
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.dataFrom[0].extract.key
          value: pushsecrets/cluster-ca
      - equal:
          path: spec.target.template.metadata.labels["cluster-ca.vp.io/component"]
          value: export
  - it: honors global secretStore name override
    set:
      eso:
        externalSecret:
          enabled: true
      global:
        secretStore:
          name: my-vault-store
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-vault-store
  - it: honors root secretStore name from clustergroup
    set:
      secretStore:
        name: my-cluster-store
        kind: ClusterSecretStore
      eso:
        externalSecret:
          enabled: true
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-cluster-store
  - it: honors custom vaultKey override
    set:
      eso:
        externalSecret:
          enabled: true
          vaultKey: custom/path/in-vault
    asserts:
      - equal:
          path: spec.dataFrom[0].extract.key
          value: custom/path/in-vault
  - it: adds argo sync-wave annotation when configured
    set:
      eso:
        externalSecret:
          enabled: true
          argoCDSyncWave: 11
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "11"
