suite: sync job
templates:
  - job-sync.yaml
release:
  name: testrel
tests:
  - it: does not render when syncJob is disabled
    set:
      syncJob:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders sync Job as Argo Sync hook at wave 12 with ose-cli
    set:
      syncJob:
        enabled: true
        argoCDSyncWave: 12
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.namespace
          value: vp-manage-proxycluster-ca
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "12"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation,HookSucceeded
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^registry\\.redhat\\.io/openshift4/ose-cli:"
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext
  - it: sets WRITE_HUB_EXPORT false on spoke cluster
    set:
      hubCluster: false
      syncJob:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WRITE_HUB_EXPORT
            value: "false"
