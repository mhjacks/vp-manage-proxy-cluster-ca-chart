suite: trust bundle differential by namespace name
templates:
  - trust-bundle-differential.yaml
release:
  name: testrel
tests:
  - it: does not render when differentialBundle is disabled
    asserts:
      - hasDocuments:
          count: 0
  - it: does not render when trustManager is disabled
    set:
      trustManager.enabled: false
      trustManager.differentialBundle.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: does not render when byNamespaceNameBundle is disabled
    set:
      trustManager.differentialBundle.enabled: true
      trustManager.differentialBundle.byNamespaceNameBundle.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders differential Bundle without useDefaultCAs and with dot-free key
    set:
      trustManager.differentialBundle.enabled: true
    asserts:
      - isKind:
          of: Bundle
      - equal:
          path: apiVersion
          value: trust.cert-manager.io/v1alpha1
      - equal:
          path: metadata.name
          value: vp-pattern-proxy-ca-bundle-differential
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: trust-bundle-differential-by-namespace-name
      - notExists:
          path: spec.sources[0].useDefaultCAs
      - equal:
          path: spec.sources[0].secret.selector.matchLabels["cluster-ca.vp.io/component"]
          value: export
      - equal:
          path: spec.sources[0].secret.includeAllKeys
          value: true
      - equal:
          path: spec.sources[1].secret.selector.matchLabels["cluster-ca.vp.io/component"]
          value: hub-export
      - equal:
          path: spec.target.configMap.key
          value: cabundle
      - equal:
          path: spec.target.namespaceSelector.matchExpressions[0].key
          value: kubernetes.io/metadata.name
      - equal:
          path: spec.target.namespaceSelector.matchExpressions[0].operator
          value: In
      - equal:
          path: spec.target.namespaceSelector.matchExpressions[0].values[0]
          value: openshift-config
  - it: targets multiple explicit namespaces when configured
    set:
      trustManager.differentialBundle.enabled: true
      trustManager.differentialBundle.byNamespaceNameBundle.namespaces:
        - app-ns-a
        - app-ns-b
    asserts:
      - equal:
          path: spec.target.namespaceSelector.matchExpressions[0].values
          value:
            - app-ns-a
            - app-ns-b
  - it: honors custom differential bundle name and target key
    set:
      trustManager.differentialBundle.enabled: true
      trustManager.differentialBundle.name: my-diff-ca
      trustManager.differentialBundle.targetKey: cluster_ca
    asserts:
      - equal:
          path: metadata.name
          value: my-diff-ca
      - equal:
          path: spec.target.configMap.key
          value: cluster_ca
  - it: appends additionalCaBundles as inLine by default
    set:
      trustManager.differentialBundle.enabled: true
      additionalCaBundles:
        - DIFF-INLINE-CA-PEM
    asserts:
      - matchRegex:
          path: spec.sources[2].inLine
          pattern: DIFF-INLINE-CA-PEM
  - it: omits additionalCaBundles when includeAdditionalCaBundles is false
    set:
      trustManager.differentialBundle.enabled: true
      trustManager.differentialBundle.includeAdditionalCaBundles: false
      additionalCaBundles:
        - DIFF-INLINE-CA-PEM
    asserts:
      - lengthEqual:
          path: spec.sources
          count: 2
      - notExists:
          path: spec.sources[2]
  - it: fails when targetKey contains a dot
    set:
      trustManager.differentialBundle.enabled: true
      trustManager.differentialBundle.targetKey: ca-bundle.crt
    asserts:
      - failedTemplate:
          errorMessage: "trustManager.differentialBundle.targetKey \"ca-bundle.crt\" must not contain '.'"
