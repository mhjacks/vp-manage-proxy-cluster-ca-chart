# PEM blocks are merged into the bundle before de-duplication (each list entry is one or more certs).
additionalCaBundles: []

# ACM Policy + PlacementBinding: enforce cluster Proxy trustedCA on selected clusters (default on).
# The Job/CronJob still owns ConfigMap content; Policy keeps Proxy wired to that ConfigMap name.
# Ensure a Placement named placementRef.name exists in hubNamespace (or override both), or set
# policy.enabled false until it does.
policy:
  enabled: true
  hubNamespace: open-cluster-management
  name: ""
  placementRef:
    # Default matches a Placement you can create for this chart; override to your cluster set.
    name: vp-proxy-ca
    # Defaults to hubNamespace when empty (Placement lives in the binding namespace).
    namespace: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
