---
# Namespace for the hub CronJob/Job, RBAC, and script ConfigMap.
namespace: vp-manage-proxy-cluster-ca

# Clustergroup passthrough (config-demo pattern); eso.secretStore overrides when set.
secretStore:
  name: ""
  kind: ClusterSecretStore

# Hub vs spoke: auto-detect from global.localClusterDomain == global.hubClusterDomain or clusterGroup.isHubCluster.
hubCluster: ""

nameOverride: ""
fullnameOverride: ""

image:
  repository: quay.io/validatedpatterns/imperative-container
  tag: v1
  pullPolicy: IfNotPresent

# ConfigMap in vp-manage-proxycluster-ca holding ca-bundle.crt for cluster Proxy trustedCA.
configMapName: vp-pattern-proxy-ca-bundle
targetNamespace: openshift-config

# trust-manager Bundle maintains the Proxy ConfigMap by merging trustNamespace sources
# (Secrets from ESO ExternalSecret + hub-export Secret) into targetNamespace/configMapName.
trustManager:
  # -- When true, render trust.cert-manager.io/v1alpha1 Bundle and write merged PEM to the trust source ConfigMap.
  enabled: true
  # -- OpenShift TrustManager CR (requires cert-manager Subscription with UNSUPPORTED_ADDON_FEATURES=TrustManager=true).
  operator:
    enabled: true
    name: cluster
    argoCDSyncWave: 6
    filterExpiredCertificates: Enabled
    defaultCAPackage:
      policy: Enabled
  # -- Namespace where trust-manager reads Bundle sources (must match TrustManager.spec.trustManagerConfig.trustNamespace).
  trustNamespace: cert-manager
  # -- Bundle metadata.name and target ConfigMap name in targetNamespace (defaults to configMapName).
  bundleName: ""
  sourceConfigMapName: ""
  sourceKey: ca-bundle.crt
  targetKey: ca-bundle.crt
  labels:
    component: cluster-ca.vp.io/component
    export: export
    hubExport: hub-export
    static: static
    managedCluster: cluster-ca.vp.io/managed-cluster
    clusterGroup: cluster-ca.vp.io/cluster-group
  bundle:
    argoCDSyncWave: 7
    # -- Prepend useDefaultCAs to Bundle sources (platform CA package). Merged at trust-manager reconcile time.
    useDefaultCAs: true
    # -- trust-manager Bundle spec.sources. Spoke PushSecrets label hub Secrets with labels.export;
    # hub gather job labels hub-export Secret with labels.hubExport.
    sources:
      - secret:
          selector:
            matchLabels:
              cluster-ca.vp.io/component: export
          includeAllKeys: true
      - secret:
          selector:
            matchLabels:
              cluster-ca.vp.io/component: hub-export
          key: ca-bundle.crt
  # -- by-namespace-name Bundle: injects configMapName into explicit OpenShift system namespaces.
  # Use for openshift-config and other platform namespaces you cannot label in GitOps.
  byNamespaceNameBundle:
    enabled: true
    argoCDSyncWave: 7
    # -- Namespace names (defaults to [targetNamespace] when empty).
    namespaces: []
  # -- by-label Bundle: same sources/target key as by-namespace-name, namespaceSelector matchLabels.
  # Use for workload namespaces you create and label in the pattern GitOps.
  byLabelBundle:
    enabled: true
    name: ""
    argoCDSyncWave: 7
    targetKey: ""
    namespaceSelector:
      matchLabels:
        cluster-ca.vp.io/trust-bundle-target: "true"

serviceAccount:
  create: true
  name: ""

# Hub-only: collect local API/ingress CAs into hub-export Secret and patch Proxy.
cronJob:
  enabled: true
  suspend: false
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

# One-shot Job: patch Proxy (and hub-export on hub). Argo Sync hook at wave 12 (after ESO/Bundle).
syncJob:
  enabled: true
  argoCDSyncWave: 12
  # -- ose-cli avoids setgroups errors from root-based imperative-container on restricted SCC.
  image:
    repository: registry.redhat.io/openshift4/ose-cli
    tag: latest
    pullPolicy: IfNotPresent
  # -- Optional pod/container securityContext overrides (omit for SCC-assigned UID with ose-cli).
  # podSecurityContext: {}
  # containerSecurityContext: {}

# ESO PushSecret export on each cluster; ExternalSecret imports Vault pushsecrets into trustNamespace.
# Vault paths and policies: rhvp.cluster_utils (make load-secrets).
# Prerequisites: openshift-external-secrets Application Healthy and ClusterSecretStore vault-backend Ready.
eso:
  # -- Default Argo CD sync-wave for ExternalSecret when externalSecret.argoCDSyncWave is unset (after PushSecret).
  argoCDSyncWave: 11
  secretStore:
    # -- ClusterSecretStore name. Empty: use secretStore.name (clustergroup), global.secretStore.name, else vault-backend.
    name: ""
    kind: ClusterSecretStore
  vault:
    # -- PushSecret remoteKey (KV v2 path relative to ClusterSecretStore mount).
    remoteKey: pushsecrets/cluster-ca
  export:
    # -- When true, render export namespace, CronJob, sync Job, and PushSecret on this cluster.
    enabled: true
    # -- Image for export Jobs (ose-cli avoids setgroups errors from root-based imperative-container).
    image:
      repository: registry.redhat.io/openshift4/ose-cli
      tag: latest
      pullPolicy: IfNotPresent
    # -- Argo CD sync-wave for export namespace/RBAC/CronJob (before export sync Job).
    argoCDSyncWave: 8
    namespace: vp-proxy-ca-sync
    serviceAccountName: vp-proxy-ca-exporter
    # -- Vault property name (defaults to global.clusterDomain).
    vaultProperty: ""
    secretName: cluster-ca-export
    key: ca-bundle.crt
    schedule: "*/10 * * * *"
    syncJob:
      # -- One-shot Job (Argo Sync hook) that creates cluster-ca-export before PushSecret reconciles.
      enabled: true
      argoCDSyncWave: 9
  pushSecret:
    name: cluster-ca-export
    refreshInterval: 1m30s
    updatePolicy: Replace
    deletionPolicy: None
    # -- Argo CD sync-wave (after export sync Job creates the local Secret; before ExternalSecret).
    argoCDSyncWave: 10
  hubExport:
    # -- Hub-only Secret in trustNamespace written by the gather CronJob (labels.hubExport).
    secretName: cluster-ca-hub
  externalSecret:
    # -- ExternalSecret in trustManager.trustNamespace importing all spoke CAs from Vault.
    enabled: true
    name: cluster-ca-pushsecrets-import
    targetSecretName: cluster-ca-pushsecrets-import
    refreshInterval: 1m30s
    # -- Vault KV path for dataFrom.extract. Empty: use eso.vault.remoteKey (pushsecrets/cluster-ca).
    # Do not use secret/data/ prefix when ClusterSecretStore path is already "secret" (KV v2).
    vaultKey: ""
    # -- Argo CD sync-wave (after PushSecret writes this cluster's property to Vault).
    argoCDSyncWave: 11

# -- Include API CA PEMs in hub-export and spoke export (default true).
includeApiCA: true
# -- Include default ingress router-ca PEMs when API access allows.
includeIngressCA: true

# PEM strings appended as trust-manager Bundle inLine sources when trustManager.enabled.
additionalCaBundles: []

# Optional CronJob(s) that curl hub + managed-cluster API/ingress endpoints using the
# labeled trust bundle ConfigMap injected into each listed namespace.
trustTest:
  # -- When true, render trust-test CronJobs in trustTest.namespaces (requires non-empty list).
  enabled: false
  # -- Namespaces to install the tester. Each must receive configMapName via byNamespaceNameBundle
  # (list the namespace there) or set per-namespace caBundle.configMapName. By-label distribution
  # is optional; set trustTest.caBundle.configMapName to the by-label Bundle name to use it.
  # Each entry may be a string namespace name or an object with name, optional additionalIngress,
  # optional caBundle.configMapName.
  namespaces: []
  schedule: "0 */6 * * *"
  suspend: false
  argoCDSyncWave: 13
  activeDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  caWaitSeconds: 300
  discoverManagedClusters: true
  # -- Discover cluster domains from ESO import Secret keys (Vault pushsecrets/cluster-ca properties).
  discoverExportSecret: true
  exportSecret:
    # -- Namespace of the import Secret (defaults to trustManager.trustNamespace).
    namespace: ""
    # -- Import Secret name (defaults to eso.externalSecret.targetSecretName).
    name: ""
  includeLocalCluster: true
  # -- When false, unreachable remote endpoints log a warning instead of failing the job.
  requireRemoteReachable: false
  image:
    # -- ose-cli includes oc and curl; avoids setgroups errors from root-based imperative-container.
    repository: registry.redhat.io/openshift4/ose-cli
    tag: latest
    pullPolicy: IfNotPresent
  caBundle:
    # -- Empty: configMapName (by-namespace-name / Proxy bundle). Set to the by-label Bundle name to use labeled distribution.
    configMapName: ""
    key: ca-bundle.crt
    mountPath: /etc/pki/trust
  ingress:
    # -- Default ingress TLS check uses the OpenShift console on the cluster apps domain.
    console:
      enabled: true
      # -- %s is the ingress domain (apps.<cluster>.<base>) from Ingress.config or derived from the API URL.
      hostTemplate: "console-openshift-console.%s"
      path: "/"
      routeName: console
      routeNamespace: openshift-console
    # -- Extra ingress checks expanded per cluster apps domain (hostTemplate) or fixed url.
    # - name: config-demo
    #   hostTemplate: "config-demo-config-demo.%s"
    #   path: "/index.html"
    # - name: vault
    #   url: "https://vault.example.com/v1/sys/health"
    additional: []
  # -- Optional explicit targets merged with ACM/local discovery (supports additionalIngress per target).
  targets: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Pod-level security for hub gather/sync Jobs only (export Jobs omit this; SCC assigns UID).
# Do not set runAsUser/runAsGroup/runAsNonRoot. Do not enable podHostUsers with imperative-container (setgroups EINVAL).
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Set true only when your cluster requires restricted-v3 hostUsers on hub Jobs (not compatible with imperative-container).
podHostUsers: false

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
